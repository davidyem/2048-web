<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#faf8ef" />
  <title>2048</title>
  <style>
    :root {
      --page-bg: #faf8ef;
      --ink: #776e65;
      --muted: #8f7f70;
      --board: #bbada0;
      --cell: rgba(238, 228, 218, 0.35);
      --gap: clamp(9px, 2.4vw, 13px);
      --radius: clamp(7px, 1.7vw, 10px);
      --move-ms: 72ms;
      --shadow: 0 14px 40px rgba(93, 77, 64, 0.08);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100dvh;
      overflow: hidden;
      background: var(--page-bg);
      color: var(--ink);
      font-family: ui-rounded, "SF Pro Rounded", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overscroll-behavior: none;
      touch-action: none;
    }

    button { font: inherit; }


    .app {
      width: min(100% - 28px, 520px);
      min-height: 100dvh;
      margin: 0 auto;
      padding: max(20px, env(safe-area-inset-top)) 0 max(24px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .topbar {
      display: grid;
      grid-template-columns: clamp(104px, 27vw, 132px) 1fr;
      gap: 14px;
      margin-bottom: 12px;
    }

    .logo-tile {
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: #f2c515;
      color: #fff;
      font-size: clamp(36px, 9vw, 48px);
      line-height: 1;
      letter-spacing: -.07em;
      font-weight: 900;
      box-shadow: var(--shadow);
    }

    .score-panel {
      min-width: 0;
      display: grid;
      grid-template-rows: 1fr auto;
      gap: 8px;
    }

    .scores {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .scorebox {
      min-width: 0;
      border-radius: 8px;
      padding: 12px 8px 10px;
      background: #b9aa9f;
      color: #fff;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .scorebox .label {
      display: block;
      font-size: clamp(11px, 2.8vw, 13px);
      line-height: 1.05;
      font-weight: 850;
      letter-spacing: .06em;
      color: #f5eee8;
    }

    .scorebox .value {
      display: block;
      margin-top: 7px;
      font-size: clamp(25px, 7.2vw, 35px);
      line-height: .95;
      font-weight: 900;
      letter-spacing: -.035em;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hint {
      margin: 0 1px 14px;
      font-size: clamp(14px, 3.8vw, 17px);
      line-height: 1.3;
      color: #6f665f;
      font-weight: 520;
    }

    .new-game {
      width: 100%;
      border: 0;
      border-radius: 6px;
      padding: 9px 12px;
      background: #ef9b63;
      color: #fff;
      font-size: 13px;
      letter-spacing: .035em;
      font-weight: 900;
      cursor: pointer;
      transition: transform 90ms ease, filter 100ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    .new-game:hover { filter: brightness(1.04); }
    .new-game:active { transform: scale(.985); }
    .new-game:focus-visible { outline: 3px solid rgba(239, 155, 99, .28); outline-offset: 3px; }

    .board-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      border-radius: calc(var(--radius) + 2px);
      box-shadow: var(--shadow);
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
      contain: layout paint style;
    }

    .board {
      position: absolute;
      inset: 0;
      overflow: hidden;
      padding: var(--gap);
      border-radius: inherit;
      background: var(--board);
    }

    .grid {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: var(--gap);
    }

    .cell {
      border-radius: var(--radius);
      background: var(--cell);
    }

    .tile-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }

    /* A rapid follow-up move finishes the previous visual step immediately,
       so transforms never build up a delayed animation tail. */
    .tile-layer.instant .tile { transition: none !important; }

    .tile {
      --row: 0;
      --col: 0;
      --scale: 1;
      position: absolute;
      top: var(--gap);
      left: var(--gap);
      width: calc((100% - (5 * var(--gap))) / 4);
      height: calc((100% - (5 * var(--gap))) / 4);
      transform:
        translate3d(
          calc(var(--col) * (100% + var(--gap))),
          calc(var(--row) * (100% + var(--gap))),
          0
        )
        scale(var(--scale));
      transition: transform var(--move-ms) cubic-bezier(.18,.72,.22,1);
      will-change: transform;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      z-index: 3;
    }

    .tile-inner {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      border-radius: var(--radius);
      background: #eee4da;
      color: #776e65;
      font-size: clamp(30px, 10vw, 54px);
      line-height: 1;
      font-weight: 900;
      letter-spacing: -.055em;
      box-shadow: 0 2px 5px rgba(63, 51, 42, .04);
      transform: translateZ(0) scale(1);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .tile[data-value="4"] .tile-inner { background: #f1e4ca; }
    .tile[data-value="8"] .tile-inner { background: #f3ae70; color: #fff; }
    .tile[data-value="16"] .tile-inner { background: #f18a57; color: #fff; }
    .tile[data-value="32"] .tile-inner { background: #f36d52; color: #fff; }
    .tile[data-value="64"] .tile-inner { background: #ef4e36; color: #fff; }
    .tile[data-value="128"] .tile-inner { background: #edcf72; color: #f9f6f2; font-size: clamp(26px, 8.6vw, 46px); }
    .tile[data-value="256"] .tile-inner { background: #edcc61; color: #f9f6f2; font-size: clamp(26px, 8.6vw, 46px); }
    .tile[data-value="512"] .tile-inner { background: #edc850; color: #f9f6f2; font-size: clamp(26px, 8.6vw, 46px); }
    .tile[data-value="1024"] .tile-inner { background: #edc53f; color: #f9f6f2; font-size: clamp(21px, 7.2vw, 38px); }
    .tile[data-value="2048"] .tile-inner { background: #edc22e; color: #f9f6f2; font-size: clamp(21px, 7.2vw, 38px); box-shadow: 0 0 24px rgba(237, 194, 46, .28); }
    .tile[data-value="4096"] .tile-inner,
    .tile[data-value="8192"] .tile-inner { background: #3c3a32; color: #f9f6f2; font-size: clamp(21px, 7.2vw, 38px); }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: 24px;
      border-radius: inherit;
      background: rgba(250, 248, 239, .74);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 180ms ease, visibility 180ms ease;
    }

    .overlay.show { opacity: 1; visibility: visible; }

    .overlay-card {
      text-align: center;
      transform: translateY(4px) scale(.98);
      transition: transform 180ms ease;
    }

    .overlay.show .overlay-card { transform: translateY(0) scale(1); }

    .overlay h2 {
      margin: 0 0 8px;
      color: #776e65;
      font-size: clamp(32px, 9vw, 48px);
      letter-spacing: -.045em;
    }

    .overlay p {
      margin: 0 0 18px;
      color: #8f7f70;
      font-weight: 650;
    }

    .overlay-actions { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }

    .overlay-actions button {
      border: 0;
      border-radius: 8px;
      padding: 11px 15px;
      background: #8f7a66;
      color: #fff;
      font-weight: 800;
      cursor: pointer;
    }

    .overlay-actions .secondary { background: rgba(143, 122, 102, .16); color: #776e65; }

    .gesture-note {
      margin: 13px 2px 0;
      text-align: center;
      font-size: 12px;
      line-height: 1.45;
      color: #a29283;
    }

    .trackpad-config {
      appearance: none;
      border: 0;
      padding: 2px 4px;
      margin: 0 0 0 3px;
      background: transparent;
      color: #8f7a66;
      font: inherit;
      font-weight: 800;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 2px;
      cursor: pointer;
    }

    .trackpad-config:hover { color: #6f6257; }
    .trackpad-config:focus-visible { outline: 2px solid rgba(143, 122, 102, .35); outline-offset: 2px; border-radius: 3px; }

    @media (hover: none) and (pointer: coarse) {
      .desktop-gesture { display: none; }
    }

    .trackpad-setup {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(250, 248, 239, .86);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 160ms ease, visibility 160ms ease;
      touch-action: none;
    }

    .trackpad-setup.show {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .trackpad-setup-card {
      width: min(100%, 360px);
      padding: 28px 24px 22px;
      border-radius: 14px;
      background: #fffdf8;
      text-align: center;
      box-shadow: 0 22px 70px rgba(93, 77, 64, .18);
      transform: translateY(5px) scale(.985);
      transition: transform 160ms ease;
    }

    .trackpad-setup.show .trackpad-setup-card { transform: translateY(0) scale(1); }

    .trackpad-swipe-demo {
      width: 114px;
      height: 58px;
      margin: 0 auto 16px;
      position: relative;
    }

    .trackpad-swipe-demo::before {
      content: '';
      position: absolute;
      left: 10px;
      right: 10px;
      top: 28px;
      height: 3px;
      border-radius: 3px;
      background: #d9cfc6;
    }

    .trackpad-swipe-demo::after {
      content: '←';
      position: absolute;
      top: 0;
      left: 58px;
      width: 56px;
      color: #ef9b63;
      font-size: 52px;
      line-height: 1;
      font-weight: 900;
      animation: calibrate-swipe 1.15s ease-in-out infinite;
    }

    @keyframes calibrate-swipe {
      0%, 18% { transform: translateX(0); opacity: .35; }
      68%, 84% { transform: translateX(-58px); opacity: 1; }
      100% { transform: translateX(-58px); opacity: 0; }
    }

    .trackpad-setup h2 {
      margin: 0 0 8px;
      color: #776e65;
      font-size: 27px;
      line-height: 1.1;
      letter-spacing: -.035em;
    }

    .trackpad-setup p {
      margin: 0 auto 18px;
      max-width: 285px;
      color: #8f7f70;
      font-size: 15px;
      line-height: 1.45;
      font-weight: 620;
    }

    .trackpad-setup-status {
      min-height: 20px;
      margin-top: -7px !important;
      margin-bottom: 12px !important;
      color: #ef9b63 !important;
      font-size: 13px !important;
      font-weight: 800 !important;
    }

    .trackpad-skip {
      appearance: none;
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      background: rgba(143, 122, 102, .13);
      color: #776e65;
      font: inherit;
      font-size: 13px;
      font-weight: 820;
      cursor: pointer;
    }

    .trackpad-skip:hover { background: rgba(143, 122, 102, .2); }

    @media (max-width: 430px) {
      .app {
        width: min(100% - 22px, 520px);
        justify-content: flex-start;
        padding-top: max(16px, env(safe-area-inset-top));
      }
      .topbar { grid-template-columns: 96px 1fr; gap: 10px; margin-bottom: 10px; }
      .scorebox { padding: 9px 6px 8px; }
      .new-game { padding: 7px 9px; font-size: 11px; }
      .hint { margin-bottom: 11px; font-size: 14px; }
    }

    @media (max-height: 700px) and (orientation: landscape) {
      .app { width: min(100% - 24px, 460px); padding-block: 12px; }
      .topbar { margin-bottom: 8px; }
      .hint, .gesture-note { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      :root { --move-ms: 1ms; }
      .tile, .overlay, .overlay-card, .new-game, .trackpad-setup, .trackpad-setup-card, .trackpad-swipe-demo::after { animation: none !important; transition-duration: 1ms !important; }
    }
  </style>
</head>
<body data-build="responsive-animation-v7">
  <main class="app" aria-label="2048 game">
    <header class="topbar">
      <div class="logo-tile" aria-label="2048">2048</div>
      <div class="score-panel">
        <div class="scores" aria-label="Score">
          <div class="scorebox"><span class="label">SCORE</span><span class="value" id="score">0</span></div>
          <div class="scorebox"><span class="label">BEST</span><span class="value" id="best">0</span></div>
        </div>
        <button class="new-game" id="newGame" type="button">NEW GAME</button>
      </div>
    </header>

    <p class="hint">Join the numbers and reach the <strong>2048</strong> tile!</p>

    <section class="board-wrap" id="boardWrap" aria-label="2048 board">
      <div class="board" aria-hidden="true">
        <div class="grid">
          <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
          <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
          <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
          <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
        </div>
      </div>
      <div class="tile-layer" id="tileLayer"></div>
      <div class="overlay" id="overlay" aria-live="polite">
        <div class="overlay-card">
          <h2 id="overlayTitle">Game over</h2>
          <p id="overlayText">Try one more round.</p>
          <div class="overlay-actions">
            <button type="button" id="continueBtn" class="secondary">Continue</button>
            <button type="button" id="retryBtn">New game</button>
          </div>
        </div>
      </div>
    </section>

    <p class="gesture-note">
      <span>Телефон: свайп одним пальцем</span>
      <span class="desktop-gesture">· Mac: двумя пальцами
        <button class="trackpad-config" id="trackpadConfig" type="button">Настроить трекпад</button>
      </span>
    </p>
  </main>

  <div class="trackpad-setup" id="trackpadSetup" role="dialog" aria-modal="true" aria-labelledby="trackpadSetupTitle">
    <div class="trackpad-setup-card">
      <div class="trackpad-swipe-demo" aria-hidden="true"></div>
      <h2 id="trackpadSetupTitle">Настройка трекпада</h2>
      <p>Проведи двумя пальцами справа налево. Игра запомнит именно физическое направление жеста.</p>
      <p class="trackpad-setup-status" id="trackpadSetupStatus" aria-live="polite">Жду свайп влево…</p>
      <button class="trackpad-skip" id="trackpadSkip" type="button">Пока пропустить</button>
    </div>
  </div>

  <script>
    (() => {
      'use strict';

      const SIZE = 4;
      const REDUCED_MOTION = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const MOVE_MS = REDUCED_MOTION ? 1 : 72;
      const MOVE_SETTLE_MS = MOVE_MS + 18;
      const boardWrap = document.getElementById('boardWrap');
      const tileLayer = document.getElementById('tileLayer');
      const scoreEl = document.getElementById('score');
      const bestEl = document.getElementById('best');
      const overlay = document.getElementById('overlay');
      const overlayTitle = document.getElementById('overlayTitle');
      const overlayText = document.getElementById('overlayText');
      const continueBtn = document.getElementById('continueBtn');
      const newGameBtn = document.getElementById('newGame');
      const retryBtn = document.getElementById('retryBtn');
      const trackpadConfigBtn = document.getElementById('trackpadConfig');
      const trackpadSetup = document.getElementById('trackpadSetup');
      const trackpadSetupStatus = document.getElementById('trackpadSetupStatus');
      const trackpadSkipBtn = document.getElementById('trackpadSkip');

      let tiles = [];
      const tileElements = new Map();
      let nextId = 1;
      let score = 0;
      const storage = {
        get(key) { try { return localStorage.getItem(key); } catch { return null; } },
        set(key, value) { try { localStorage.setItem(key, value); } catch {} }
      };
      let best = Number(storage.get('2048-best') || 0);
      let gameSession = 0;
      let activeMove = null;
      let moveSerial = 0;
      let interruptedMoves = 0;
      let wonShown = false;
      let keepPlaying = false;

      bestEl.textContent = String(best);

      function emptyCells(list = tiles) {
        const occupied = new Set(list.map(t => `${t.row},${t.col}`));
        const cells = [];
        for (let row = 0; row < SIZE; row++) {
          for (let col = 0; col < SIZE; col++) {
            if (!occupied.has(`${row},${col}`)) cells.push({ row, col });
          }
        }
        return cells;
      }

      function makeRandomTile(list = tiles) {
        const cells = emptyCells(list);
        if (!cells.length) return null;
        const cell = cells[Math.floor(Math.random() * cells.length)];
        return {
          id: nextId++,
          value: Math.random() < 0.9 ? 2 : 4,
          row: cell.row,
          col: cell.col,
          isNew: true
        };
      }

      function playTilePulse(el, kind) {
        if (REDUCED_MOTION || typeof el.animate !== 'function') return;
        const inner = el.querySelector('.tile-inner');
        if (!inner) return;

        for (const animation of inner.getAnimations()) animation.cancel();
        const keyframes = kind === 'merge'
          ? [
              { transform: 'translateZ(0) scale(1)' },
              { transform: 'translateZ(0) scale(1.105)', offset: 0.48 },
              { transform: 'translateZ(0) scale(1)' }
            ]
          : [
              { transform: 'translateZ(0) scale(.72)', opacity: .64 },
              { transform: 'translateZ(0) scale(1)', opacity: 1 }
            ];

        inner.animate(keyframes, {
          duration: kind === 'merge' ? 104 : 92,
          easing: 'cubic-bezier(.2,.72,.24,1)',
          fill: 'none'
        });
      }

      function cancelTilePulses() {
        for (const el of tileElements.values()) {
          const inner = el.querySelector('.tile-inner');
          if (!inner) continue;
          for (const animation of inner.getAnimations()) animation.cancel();
        }
      }

      function tileElement(tile, { animateNew = true } = {}) {
        const el = document.createElement('div');
        el.className = 'tile';
        el.dataset.id = tile.id;
        el.dataset.value = tile.value;
        el.style.setProperty('--row', tile.row);
        el.style.setProperty('--col', tile.col);

        const inner = document.createElement('div');
        inner.className = 'tile-inner';
        inner.textContent = tile.value;
        el.appendChild(inner);
        tileLayer.appendChild(el);
        tileElements.set(tile.id, el);

        const shouldAnimate = tile.isNew && animateNew;
        tile.isNew = false;
        if (shouldAnimate) playTilePulse(el, 'new');
        return el;
      }

      function getTileEl(id) {
        return tileElements.get(id) || null;
      }

      function removeTileEl(id) {
        const el = tileElements.get(id);
        if (el) el.remove();
        tileElements.delete(id);
      }

      function renderAll() {
        tileLayer.textContent = '';
        tileElements.clear();
        for (const tile of tiles) tileElement(tile);
        updateScore();
      }

      function updateScore() {
        scoreEl.textContent = String(score);
        if (score > best) {
          best = score;
          bestEl.textContent = String(best);
          storage.set('2048-best', String(best));
        }
      }

      function lineCoordinates(direction, line) {
        const coords = [];
        for (let i = 0; i < SIZE; i++) {
          if (direction === 'left') coords.push({ row: line, col: i });
          if (direction === 'right') coords.push({ row: line, col: SIZE - 1 - i });
          if (direction === 'up') coords.push({ row: i, col: line });
          if (direction === 'down') coords.push({ row: SIZE - 1 - i, col: line });
        }
        return coords;
      }

      function calculateMove(direction) {
        const byCell = new Map(tiles.map(t => [`${t.row},${t.col}`, t]));
        const motions = new Map();
        const survivors = [];
        const removedIds = [];
        const mergedIds = [];
        let gained = 0;
        let changed = false;

        for (let line = 0; line < SIZE; line++) {
          const coords = lineCoordinates(direction, line);
          const items = coords.map(c => byCell.get(`${c.row},${c.col}`)).filter(Boolean);
          const placed = [];

          for (const tile of items) {
            const last = placed[placed.length - 1];
            if (last && !last.merged && last.tile.value === tile.value) {
              const target = coords[placed.length - 1];
              motions.set(tile.id, target);
              removedIds.push(tile.id);
              last.merged = true;
              last.nextValue *= 2;
              gained += last.nextValue;
              mergedIds.push(last.tile.id);
              if (tile.row !== target.row || tile.col !== target.col) changed = true;
            } else {
              const target = coords[placed.length];
              const entry = { tile, target, nextValue: tile.value, merged: false };
              placed.push(entry);
              motions.set(tile.id, target);
              if (tile.row !== target.row || tile.col !== target.col) changed = true;
            }
          }

          for (const entry of placed) {
            survivors.push({
              id: entry.tile.id,
              value: entry.nextValue,
              row: entry.target.row,
              col: entry.target.col,
              isNew: false
            });
          }
        }

        if (removedIds.length) changed = true;
        return { changed, motions, survivors, removedIds, mergedIds, gained };
      }

      function setTilePosition(el, row, col) {
        el.style.setProperty('--row', row);
        el.style.setProperty('--col', col);
      }

      function commitMove(move, { interrupted = false } = {}) {
        if (!move || move.done) return;
        move.done = true;
        clearTimeout(move.timer);
        if (activeMove === move) activeMove = null;
        if (move.session !== gameSession) return;

        if (interrupted) {
          interruptedMoves += 1;
          cancelTilePulses();
        }

        const { result } = move;
        for (const id of result.removedIds) removeTileEl(id);

        tiles = result.survivors;
        score += result.gained;
        updateScore();

        for (const tile of tiles) {
          const el = getTileEl(tile.id);
          if (!el) continue;
          const oldValue = Number(el.dataset.value);
          if (oldValue !== tile.value) {
            el.dataset.value = tile.value;
            const inner = el.querySelector('.tile-inner');
            if (inner) inner.textContent = tile.value;
          }
        }

        if (!interrupted) {
          for (const id of result.mergedIds) {
            const el = getTileEl(id);
            if (el) playTilePulse(el, 'merge');
          }
        }

        const spawned = makeRandomTile(tiles);
        if (spawned) {
          tiles.push(spawned);
          tileElement(spawned, { animateNew: !interrupted });
        }

        evaluateState();
      }

      function cancelActiveMove() {
        if (!activeMove) return;
        activeMove.done = true;
        clearTimeout(activeMove.timer);
        activeMove = null;
      }

      function interruptActiveMove() {
        if (!activeMove) return;

        // If a transition is retargeted while it is still running, its new
        // duration starts from the interpolated position and the picture can
        // trail behind rapid input. Snap the old move to its target for one
        // style flush, commit the state, then enable transitions again.
        tileLayer.classList.add('instant');
        cancelTilePulses();
        void tileLayer.offsetWidth;
        commitMove(activeMove, { interrupted: true });
        tileLayer.classList.remove('instant');
        void tileLayer.offsetWidth;
      }

      function performMove(direction) {
        // There is deliberately no move queue. The latest gesture always acts
        // on the latest committed board state instead of waiting for animation.
        if (activeMove) interruptActiveMove();
        if (overlay.classList.contains('show') && !keepPlaying) return;

        const result = calculateMove(direction);
        if (!result.changed) return;

        const move = {
          id: ++moveSerial,
          session: gameSession,
          result,
          timer: 0,
          done: false
        };
        activeMove = move;

        for (const tile of tiles) {
          const target = result.motions.get(tile.id);
          const el = getTileEl(tile.id);
          if (target && el) setTilePosition(el, target.row, target.col);
        }

        move.timer = window.setTimeout(() => {
          commitMove(move);
        }, MOVE_SETTLE_MS);
      }

      function canMove() {
        if (tiles.length < SIZE * SIZE) return true;
        const map = new Map(tiles.map(t => [`${t.row},${t.col}`, t.value]));
        for (let row = 0; row < SIZE; row++) {
          for (let col = 0; col < SIZE; col++) {
            const value = map.get(`${row},${col}`);
            if (col + 1 < SIZE && map.get(`${row},${col + 1}`) === value) return true;
            if (row + 1 < SIZE && map.get(`${row + 1},${col}`) === value) return true;
          }
        }
        return false;
      }

      function evaluateState() {
        if (!wonShown && tiles.some(t => t.value >= 2048)) {
          wonShown = true;
          overlayTitle.textContent = '2048!';
          overlayText.textContent = 'You reached 2048. Keep going?';
          continueBtn.hidden = false;
          overlay.classList.add('show');
          return;
        }
        if (!canMove()) {
          overlayTitle.textContent = 'Game over';
          overlayText.textContent = `Score: ${score}`;
          continueBtn.hidden = true;
          overlay.classList.add('show');
        }
      }

      function hideOverlay() {
        overlay.classList.remove('show');
      }

      function resetGame() {
        gameSession += 1;
        cancelActiveMove();
        score = 0;
        wonShown = false;
        keepPlaying = false;
        hideOverlay();
        tiles = [];
        tileLayer.textContent = '';
        tileElements.clear();
        const first = makeRandomTile(tiles); if (first) tiles.push(first);
        const second = makeRandomTile(tiles); if (second) tiles.push(second);
        renderAll();
      }

      const keyToDirection = {
        ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down',
        a: 'left', d: 'right', w: 'up', s: 'down',
        A: 'left', D: 'right', W: 'up', S: 'down'
      };

      let gestureSerial = 0;
      function dispatchDirection(direction, source) {
        document.documentElement.dataset.lastGesture = direction;
        document.documentElement.dataset.lastInput = source;
        document.documentElement.dataset.gestureSerial = String(++gestureSerial);
        performMove(direction);
      }

      function directionFromVector(x, y, factor = 1) {
        const mappedX = x * factor;
        const mappedY = y * factor;
        return Math.abs(mappedX) > Math.abs(mappedY)
          ? (mappedX > 0 ? 'right' : 'left')
          : (mappedY > 0 ? 'down' : 'up');
      }

      window.addEventListener('keydown', event => {
        const direction = keyToDirection[event.key];
        if (!direction) return;
        event.preventDefault();
        dispatchDirection(direction, 'keyboard');
      }, { passive: false, capture: true });

      // Touch input uses actual pointer coordinates, so it follows the finger
      // exactly: right-to-left means LEFT, bottom-to-top means UP, and so on.
      let pointerStart = null;
      let swipeClickGuard = null;

      window.addEventListener('pointerdown', event => {
        if (event.pointerType === 'mouse' || event.isPrimary === false) return;
        pointerStart = {
          id: event.pointerId,
          x: event.clientX,
          y: event.clientY,
          target: event.target
        };
      }, { passive: true, capture: true });

      window.addEventListener('pointermove', event => {
        if (!pointerStart || pointerStart.id !== event.pointerId) return;
        const dx = event.clientX - pointerStart.x;
        const dy = event.clientY - pointerStart.y;
        if (Math.hypot(dx, dy) > 7 && event.cancelable) event.preventDefault();
      }, { passive: false, capture: true });

      window.addEventListener('pointerup', event => {
        if (!pointerStart || pointerStart.id !== event.pointerId) return;
        const dx = event.clientX - pointerStart.x;
        const dy = event.clientY - pointerStart.y;
        const startTarget = pointerStart.target;
        pointerStart = null;

        if (Math.hypot(dx, dy) < 26) return;
        if (event.cancelable) event.preventDefault();
        swipeClickGuard = { target: startTarget, until: performance.now() + 140 };
        dispatchDirection(directionFromVector(dx, dy), 'touch');
      }, { passive: false, capture: true });

      window.addEventListener('pointercancel', () => {
        pointerStart = null;
      }, { passive: true, capture: true });

      window.addEventListener('click', event => {
        const guard = swipeClickGuard;
        swipeClickGuard = null;
        if (!guard || performance.now() >= guard.until) return;

        const origin = guard.target;
        const target = event.target;
        const sameOrigin = origin === target
          || (origin instanceof Element && origin.contains(target))
          || (target instanceof Element && target.contains(origin));
        if (!sameOrigin) return;

        event.preventDefault();
        event.stopImmediatePropagation();
      }, { capture: true });

      // A browser receives trackpad motion as WheelEvent scroll deltas rather
      // than raw finger coordinates. macOS may reverse those deltas depending
      // on the user's scrolling preference, so guessing a universal sign is
      // unreliable. A one-time left-swipe calibration converts the deltas back
      // into physical finger direction and stores the result locally.
      const TRACKPAD_FACTOR_KEY = '2048-trackpad-factor-v5';
      const likelyMacDesktop = /Mac/.test(navigator.platform || navigator.userAgent)
        && (navigator.maxTouchPoints || 0) < 2;
      const savedTrackpadFactor = Number(storage.get(TRACKPAD_FACTOR_KEY));
      let trackpadFactor = savedTrackpadFactor === 1 || savedTrackpadFactor === -1
        ? savedTrackpadFactor
        : null;
      let calibrationActive = false;
      let calibrationX = 0;
      let calibrationY = 0;

      const wheelState = {
        phase: 'idle',
        x: 0,
        y: 0,
        lastAt: 0,
        lastMagnitude: 0,
        dispatchedAt: 0,
        lockedAxis: null,
        lockedSign: 0,
        idleTimer: 0
      };

      function resetWheelState() {
        wheelState.phase = 'idle';
        wheelState.x = 0;
        wheelState.y = 0;
        wheelState.lastMagnitude = 0;
        wheelState.lockedAxis = null;
        wheelState.lockedSign = 0;
      }

      function scheduleWheelIdleReset() {
        clearTimeout(wheelState.idleTimer);
        wheelState.idleTimer = window.setTimeout(resetWheelState, 125);
      }

      function beginWheelBurst() {
        wheelState.phase = 'collecting';
        wheelState.x = 0;
        wheelState.y = 0;
        wheelState.lockedAxis = null;
        wheelState.lockedSign = 0;
      }

      function showTrackpadSetup() {
        calibrationActive = true;
        calibrationX = 0;
        calibrationY = 0;
        resetWheelState();
        trackpadSetupStatus.textContent = 'Жду свайп влево…';
        trackpadSetup.classList.add('show');
      }

      function hideTrackpadSetup() {
        calibrationActive = false;
        calibrationX = 0;
        calibrationY = 0;
        trackpadSetup.classList.remove('show');
      }

      function saveTrackpadFactor(factor) {
        trackpadFactor = factor;
        storage.set(TRACKPAD_FACTOR_KEY, String(factor));
      }

      function normalizeWheelDelta(event) {
        const scale = event.deltaMode === WheelEvent.DOM_DELTA_LINE
          ? 16
          : event.deltaMode === WheelEvent.DOM_DELTA_PAGE ? window.innerHeight : 1;
        return { x: event.deltaX * scale, y: event.deltaY * scale };
      }

      function finishTrackpadCalibration() {
        const ax = Math.abs(calibrationX);
        const ay = Math.abs(calibrationY);
        if (ax < 20) return false;
        if (ax < ay * 1.3) {
          trackpadSetupStatus.textContent = 'Проведи чётко по горизонтали влево ←';
          return false;
        }

        // The instructed physical gesture is LEFT. Choose the multiplier that
        // makes the observed raw horizontal delta negative after mapping.
        const observedRawX = calibrationX;
        saveTrackpadFactor(observedRawX > 0 ? -1 : 1);
        trackpadSetupStatus.textContent = 'Готово';
        hideTrackpadSetup();
        resetWheelState();
        wheelState.phase = 'locked';
        wheelState.dispatchedAt = performance.now();
        wheelState.lockedAxis = 'x';
        wheelState.lockedSign = Math.sign(observedRawX) || -1;
        dispatchDirection('left', 'trackpad-calibration');
        return true;
      }

      function handleTrackpadWheel(event) {
        if (event.ctrlKey) return; // Keep pinch-to-zoom available.
        const delta = normalizeWheelDelta(event);
        if (Math.abs(delta.x) < 0.05 && Math.abs(delta.y) < 0.05) return;
        if (event.cancelable) event.preventDefault();

        if (calibrationActive) {
          calibrationX += delta.x;
          calibrationY += delta.y;
          finishTrackpadCalibration();
          return;
        }

        // A non-calibrated desktop still gets a usable fallback, but on a Mac
        // the setup is shown before normal play so physical direction is exact.
        const factor = trackpadFactor ?? 1;
        const now = performance.now();
        const gap = wheelState.lastAt ? now - wheelState.lastAt : Infinity;
        const absX = Math.abs(delta.x);
        const absY = Math.abs(delta.y);
        const magnitude = Math.max(absX, absY);
        const axis = absX > absY ? 'x' : 'y';
        const sign = Math.sign(axis === 'x' ? delta.x : delta.y);

        let startsNewBurst = wheelState.phase === 'idle' || gap > 90;

        if (wheelState.phase === 'locked' && !startsNewBurst) {
          const oldEnough = now - wheelState.dispatchedAt > 95;
          const directionChanged = axis !== wheelState.lockedAxis || sign !== wheelState.lockedSign;
          const clearRestart = magnitude >= Math.max(5, wheelState.lastMagnitude * 1.75);

          // Momentum normally decays. A fresh finger movement creates either a
          // sign/axis change or a sharp magnitude increase, even if the old
          // momentum packets have not fully stopped yet.
          if (oldEnough && ((directionChanged && magnitude >= 3.5) || clearRestart)) {
            startsNewBurst = true;
          }
        }

        if (startsNewBurst) beginWheelBurst();

        wheelState.lastAt = now;
        wheelState.lastMagnitude = magnitude;
        scheduleWheelIdleReset();

        if (wheelState.phase !== 'collecting') return;

        wheelState.x += delta.x;
        wheelState.y += delta.y;

        const totalX = Math.abs(wheelState.x);
        const totalY = Math.abs(wheelState.y);
        const dominant = Math.max(totalX, totalY);
        const minor = Math.min(totalX, totalY);
        if (dominant < 18) return;
        if (minor > 0 && dominant / minor < 1.18 && dominant < 44) return;

        const rawAxis = totalX > totalY ? 'x' : 'y';
        const rawValue = rawAxis === 'x' ? wheelState.x : wheelState.y;
        wheelState.phase = 'locked';
        wheelState.dispatchedAt = now;
        wheelState.lockedAxis = rawAxis;
        wheelState.lockedSign = Math.sign(rawValue);
        dispatchDirection(directionFromVector(wheelState.x, wheelState.y, factor), 'trackpad');
      }

      window.addEventListener('wheel', handleTrackpadWheel, {
        passive: false,
        capture: true
      });

      trackpadConfigBtn.addEventListener('click', showTrackpadSetup);
      trackpadSkipBtn.addEventListener('click', () => {
        if (trackpadFactor === null) saveTrackpadFactor(1);
        hideTrackpadSetup();
        resetWheelState();
      });

      // Small debug surface used by automated checks. It does not change the UI.
      window.__2048Debug = {
        directionFromVector,
        calculateMoveFor(board, direction) {
          const previousTiles = tiles;
          tiles = [];
          let id = 1;
          for (let row = 0; row < SIZE; row++) {
            for (let col = 0; col < SIZE; col++) {
              const value = Number(board[row]?.[col] || 0);
              if (value) tiles.push({ id: id++, value, row, col, isNew: false });
            }
          }
          const result = calculateMove(direction);
          const out = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
          for (const tile of result.survivors) out[tile.row][tile.col] = tile.value;
          tiles = previousTiles;
          return { board: out, gained: result.gained, changed: result.changed };
        },
        setBoard(board) {
          gameSession += 1;
          cancelActiveMove();
          hideOverlay();
          score = 0;
          tiles = [];
          for (let row = 0; row < SIZE; row++) {
            for (let col = 0; col < SIZE; col++) {
              const value = Number(board[row]?.[col] || 0);
              if (value) tiles.push({ id: nextId++, value, row, col, isNew: false });
            }
          }
          renderAll();
        },
        getBoard() {
          const board = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
          for (const tile of tiles) board[tile.row][tile.col] = tile.value;
          return board;
        },
        move(direction) {
          if (!['left', 'right', 'up', 'down'].includes(direction)) {
            throw new TypeError('direction must be left, right, up or down');
          }
          performMove(direction);
        },
        finishAnimation() {
          interruptActiveMove();
        },
        getAnimationState() {
          return {
            active: Boolean(activeMove),
            moveSerial,
            interruptedMoves,
            moveMs: MOVE_MS
          };
        },
        setTrackpadFactor(factor) {
          if (factor !== 1 && factor !== -1) throw new TypeError('factor must be 1 or -1');
          saveTrackpadFactor(factor);
          hideTrackpadSetup();
          resetWheelState();
        },
        resetWheelState,
        getTrackpadFactor() { return trackpadFactor; },
        getGestureSerial() { return gestureSerial; }
      };

      newGameBtn.addEventListener('click', resetGame);
      retryBtn.addEventListener('click', resetGame);
      continueBtn.addEventListener('click', () => {
        keepPlaying = true;
        hideOverlay();
      });

      resetGame();

      if (likelyMacDesktop && trackpadFactor === null) {
        requestAnimationFrame(showTrackpadSetup);
      }
    })();
  </script>
</body>
</html>
